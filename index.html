
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アイカツカード図鑑</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px 14px;
  background: #fff6fb;
  color: #493b50;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}
.app { max-width: 600px; margin: auto; }
header {
  text-align: center;
  padding: 24px 8px;
  background: linear-gradient(135deg,#ffd9eb,#e8ddff);
  border-radius: 22px;
}
.eyebrow {
  font-size: 11px;
  letter-spacing: 3px;
  margin: 0 0 8px;
}
h1 { font-size: 25px; margin: 0 0 8px; }
header p:last-child { margin-bottom: 0; }
.summary {
  display: flex;
  gap: 10px;
  margin: 18px 0;
}
.summary div {
  flex: 1;
  text-align: center;
  background: white;
  padding: 14px 5px;
  border-radius: 14px;
  box-shadow: 0 2px 8px #e9dce8;
  font-size: 12px;
}
.summary strong {
  display: block;
  font-size: 24px;
  color: #bd5d9a;
  margin-top: 5px;
}
input[type="search"] {
  width: 100%;
  padding: 14px;
  border: 1px solid #e5cfe1;
  border-radius: 12px;
  background: white;
  font-size: 16px;
  margin-bottom: 12px;
}
.filters {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}
.filters button {
  flex: 1;
  padding: 10px 3px;
  border: 1px solid #e5cfe1;
  border-radius: 20px;
  background: white;
  color: #684d68;
  font-size: 13px;
}
.filters button.active {
  background: #c16a9f;
  color: white;
  border-color: #c16a9f;
}
.cards {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 12px;
}
.card {
  min-width: 0;
  padding: 10px;
  border-radius: 15px;
  background: white;
  box-shadow: 0 2px 9px #eaddea;
  text-align: center;
}
.art {
  height: 125px;
  border-radius: 10px;
  background: linear-gradient(145deg,#ffe2f0,#e8e2ff);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 48px;
  overflow: hidden;
}
.art img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.card h2 {
  font-size: 14px;
  overflow-wrap: anywhere;
  margin: 12px 0 6px;
}
.number {
  font-size: 12px;
  color: #88758c;
  margin-bottom: 10px;
}
.own {
  width: 100%;
  padding: 10px 2px;
  border: 0;
  border-radius: 10px;
  background: #f4e6f4;
  color: #75476e;
  font-size: 13px;
}
.own.yes {
  background: #dff3e9;
  color: #286c4e;
}
.note {
  font-size: 12px;
  line-height: 1.7;
  color: #85758a;
  margin-top: 20px;
}
.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 30px 8px;
  color: #88758c;
}
</style>
</head>
<body>
<div class="app">
  <header>
    <p class="eyebrow">MY COLLECTION</p>
    <h1>アイカツカード図鑑</h1>
    <p>アイカツアンコール・第1弾</p>
  </header>

  <section class="summary">
    <div>登録カード<strong id="total">0</strong></div>
    <div>所持カード<strong id="owned">0</strong></div>
  </section>

  <input id="search" type="search"
    placeholder="カード名・カード番号で検索">

  <div class="filters">
    <button class="active" data-filter="all">すべて</button>
    <button data-filter="owned">所持</button>
    <button data-filter="missing">未所持</button>
  </div>

  <div id="cards" class="cards"></div>

  <p class="note">
    ※ 現在は動作確認用のサンプルカードです。
    実際の第1弾のカード情報ではありません。
  </p>
</div>

<script>
const defaultCards = [
  {id:1,name:"サンプルカード 1",number:"IC-001",art:"🌸",owned:true},
  {id:2,name:"サンプルカード 2",number:"IC-002",art:"💎",owned:false},
  {id:3,name:"サンプルカード 3",number:"IC-003",art:"🎀",owned:false}
];

const STORAGE_KEY = "aikatsu-card-collection-v1";
let cards;

try {
  const saved = localStorage.getItem(STORAGE_KEY);
  cards = saved ? JSON.parse(saved) : null;
  if (!Array.isArray(cards)) cards = null;
} catch (e) {
  cards = null;
}

if (!cards) {
  cards = defaultCards.map(card => ({...card}));
}

let filter = "all";
const list = document.getElementById("cards");
const search = document.getElementById("search");

function saveCards() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
    return true;
  } catch (e) {
    alert("保存できませんでした。ブラウザの設定を確認してください。");
    return false;
  }
}

function render() {
  const word = search.value.trim().toLowerCase();

  const visible = cards.filter(card => {
    const matches = (card.name + " " + card.number)
      .toLowerCase().includes(word);

    const matchesFilter =
      filter === "all" ||
      (filter === "owned" && card.owned) ||
      (filter === "missing" && !card.owned);

    return matches && matchesFilter;
  });

  document.getElementById("total").textContent = cards.length;
  document.getElementById("owned").textContent =
    cards.filter(card => card.owned).length;

  if (visible.length === 0) {
    list.innerHTML = '<p class="empty">カードが見つかりません</p>';
    return;
  }

  list.innerHTML = visible.map(card => `
    <article class="card">
      <div class="art">${card.art || "🃏"}</div>
      <h2>${escapeHTML(card.name)}</h2>
      <div class="number">${escapeHTML(card.number)}</div>
      <button class="own ${card.owned ? "yes" : ""}"
        data-id="${card.id}">
        ${card.owned ? "✓ 所持中" : "＋ 未所持"}
      </button>
    </article>
  `).join("");

  list.querySelectorAll(".own").forEach(button => {
    button.addEventListener("click", () => {
      const card = cards.find(
        item => String(item.id) === button.dataset.id
      );
      if (!card) return;
      card.owned = !card.owned;
      saveCards();
      render();
    });
  });
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
}

search.addEventListener("input", render);

document.querySelectorAll("[data-filter]").forEach(button => {
  button.addEventListener("click", () => {
    filter = button.dataset.filter;
    document.querySelectorAll("[data-filter]").forEach(item => {
      item.classList.toggle("active", item === button);
    });
    render();
  });
});

render();
</script>
</body>
</html>
